specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: WineryManagement
    network: arbitrum-sepolia
    source:
      address: "0x69CD17A38FDfBe7779890ca73025eF847dc20A0e"
      abi: WineryManagement
      startBlock: 99605029
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WineryCreated
      abis:
        - name: WineryManagement
          file: ./abis/WineryManagement.json
      eventHandlers:
        - event: WineryCreated(uint8,string,address,int256,int256,uint16)
          handler: handleWineryCreated
      file: ./src/winery-management.ts
  - kind: ethereum
    name: BatchManagement1
    network: arbitrum-sepolia
    source:
      address: "0xE954D7fFA466bA88B0B0aa50763DcA47F3164809"
      abi: BatchManagement1
      startBlock: 99605095
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - BatchCreated
        - BatchRemoved
        - HumidityDataPushed
        - RainDataPushed
        - SoilDataPushed
        - TemperatureDataPushed
        - WindDataPushed
      abis:
        - name: BatchManagement1
          file: ./abis/BatchManagement1.json
      eventHandlers:
        - event: BatchCreated(uint256,address,string,uint256,string,uint32)
          handler: handleBatchCreated
        - event: BatchRemoved(uint256,string,string,address)
          handler: handleBatchRemoved
        - event: HumidityDataPushed(uint256,string,string,uint16,address,uint32)
          handler: handleHumidityDataPushed
        - event: RainDataPushed(uint256,string,string,uint16,address,uint32)
          handler: handleRainDataPushed
        - event: SoilDataPushed(uint256,string,string,uint16,address,uint32)
          handler: handleSoilDataPushed
        - event: TemperatureDataPushed(uint256,string,string,uint16,address,uint32)
          handler: handleTemperatureDataPushed
        - event: WindDataPushed(uint256,string,string,uint16,address,uint32)
          handler: handleWindDataPushed
      file: ./src/batch-management-1.ts
  - kind: ethereum
    name: WineTraceability
    network: arbitrum-sepolia
    source:
      address: "0x4aD4770fA39E7EeB4c526BfC9F2adBB5ddcE13B1"
      abi: WineTraceability
      startBlock: 99605185
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - WineItemCreated
        - WineItemProgressed
      abis:
        - name: WineTraceability
          file: ./abis/WineTraceability.json
      eventHandlers:
        - event: WineItemCreated(uint256,uint8,(uint256,string,address,int256,int256),(uint256,string,string,address,uint16[],uint16[],uint16[],uint16[],uint16[],bool,uint32),uint256,uint256,uint256,uint16)
          handler: handleWineItemCreated
        - event: WineItemProgressed(uint256,uint8,uint256,uint256,uint256)
          handler: handleWineItemProgressed
      file: ./src/wine-traceability.ts
